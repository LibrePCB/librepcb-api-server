name: CI
on: [push, pull_request]
jobs:
  tests:
    name: Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Check Format
        run: uv run ruff format --check
      - name: Linting
        run: uv run ruff check
